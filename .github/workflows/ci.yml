name: Marketplace
on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly-2026-05-25
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: cargo fmt --all --check
      - run: cargo test --locked -p aio-plugin-marketplace-client --lib
      - run: cargo clippy --locked -p aio-plugin-marketplace-client --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --locked -p aio-plugin-marketplace-server --target wasm32-wasip2 -- -D warnings
      - run: |
          curl -fsSL https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz -o /tmp/dx.tar.gz
          echo '3b132551b480bc96f938f9f0d37936ee1190f994977539dcc347eaf38540d005  /tmp/dx.tar.gz' | sha256sum -c -
          sudo tar -xzf /tmp/dx.tar.gz -C /usr/local/bin
      - run: scripts/build.sh
